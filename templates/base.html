<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acrílico ERP</title>
    <!-- Bootstrap 5 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 20px;
        }
        .teste {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- CONTEÚDO PRINCIPAL -->
    <div class="container">
        <!-- NAVBAR SIMPLES -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 rounded">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">
                    <i class="bi bi-box-seam me-2"></i>
                    <strong>ACRÍLICO ERP</strong>
                </a>
            </div>
        </nav>
        
        <!-- ONDE O CONTEÚDO VAI -->
        {% block content %}
        <!-- Isso será substituído pelos templates filhos -->
        {% endblock %}
        
        <!-- RODAPÉ -->
        <footer class="mt-5 pt-4 border-top text-center text-muted">
            <p class="teste">TESTE: Se você vê esta mensagem vermelha, o template está funcionando!</p>
            <p>Sistema Acrílico ERP &copy; {% now "Y" %}</p>
        </footer>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
